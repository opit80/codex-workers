name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
          const marketplace = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
          assert.equal(plugin.name, 'codex-workers');
          assert.equal(marketplace.name, 'codex-workers');
          assert.equal(marketplace.plugins.length, 1);
          assert.equal(marketplace.plugins[0].name, 'codex-workers');
          console.log('Manifests parse and plugin names match.');
          NODE
      - name: Validate skill
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const skill = fs.readFileSync('skills/codex-workers/SKILL.md', 'utf8');
          const frontmatter = skill.match(/^---\n([\s\S]*?)\n---(?:\n|$)/);
          assert.ok(frontmatter, 'Skill frontmatter is required.');
          assert.match(frontmatter[1], /^name: codex-workers$/m);
          assert.ok(skill.includes('$ARGUMENTS'), 'Skill must contain $ARGUMENTS.');
          console.log('Skill name and task placeholder are valid.');
          NODE
